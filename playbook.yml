- name: Update les Virtual Machines
  hosts: servers
  become: yes
  tasks:
    - name: Upgrade packages
      ansible.builtin.apt:
        update_cache: yes
        upgrade: full

    - name: Desintaller les packages conflict 
      ansible.builtin.shell: |
        for pkg in docker.io docker-doc docker-compose podman-docker containerd runc; do
          apt-get remove -y $pkg
        done
      become: yes

    - name: Script dockerapt 
      ansible.builtin.script: /home/balla/dockerapt.sh

    - name: prerequesites - docker packages
      ansible.builtin.shell: |
        sudo apt-get install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin -y

    - name: docker are you there ?? (yes)
      ansible.builtin.shell: |
        sudo docker --version





